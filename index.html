<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poki Green - אימפריית המשחקים שלי</title>
    <style>
        /* עיצוב כללי של האתר בסגנון פוקי מקצועי */
        body {
            background-color: #0d0d0d; /* רקע שחור עמוק */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* סרגל עליון כמו באתרים הגדולים */
        header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #39ff14; /* קו ירוק ניאון */
            box-shadow: 0 4px 15px rgba(57, 255, 20, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.6);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .tagline {
            color: #888;
            font-size: 14px;
            font-weight: bold;
        }

        /* המכולה הראשית של רשת המשחקים */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* רשת הריבועים המושלמת של פוקי */
        .poki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        /* עיצוב הריבועים של המשחקים */
        .poki-card {
            background-color: #1f1f1f;
            border: 3px solid #2d2d2d;
            border-radius: 18px;
            aspect-ratio: 1 / 1; /* ריבוע מושלם כמו פוקי */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        /* אפקט מעבר עכבר מטורף בירוק */
        .poki-card:hover {
            transform: scale(1.05) rotate(1deg);
            border-color: #39ff14;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.5);
        }

        .poki-card .emoji-icon {
            font-size: 55px;
            margin-bottom: 10px;
            transition: transform 0.2s ease;
        }

        .poki-card:hover .emoji-icon {
            transform: scale(1.15);
        }

        .poki-card h3 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-align: center;
            padding: 0 10px;
        }

        /* עיצוב מסך המשחק המקצועי שנפתח מעל הכל (Modal) */
        .game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .game-wrapper {
            width: 90%;
            max-width: 1024px;
            height: 80%;
            background-color: #111;
            border: 4px solid #39ff14;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.6);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            background-color: #1a1a1a;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d2d2d;
        }

        .game-header h2 {
            margin: 0;
            color: #39ff14;
            font-size: 20px;
        }

        .close-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            background-color: #ff3377;
            transform: scale(1.05);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- סרגל עליון -->
    <header>
        <h1>POKI GREEN</h1>
        <div class="tagline">כל המשחקים הכי חמים במקום אחד</div>
    </header>

    <!-- רשת הריבועים של פוקי -->
    <div class="container">
        <div class="poki-grid">
            
            <!-- ריבוע 1 -->
            <div class="poki-card" onclick="openGame('🔥 מים ואש 1 🔥', 'https://gamedistribution.com')">
                <div class="emoji-icon">💧🔥</div>
                <h3>מים ואש 1</h3>
            </div>

            <!-- ריבוע 2 -->
            <div class="poki-card" onclick="openGame('📐 Geometry Dash Style 📐', 'https://gamedistribution.com')">
                <div class="emoji-icon">🟩</div>
                <h3>Geometry Dash</h3>
            </div>

            <!-- ריבוע 3 -->
            <div class="poki-card" onclick="openGame('🏍️ מרוץ אופנועים 3D 🏍️', 'https://gamedistribution.com')">
                <div class="emoji-icon">🏍️</div>
                <h3>מרוץ אופנועים</h3>
            </div>

            <!-- ריבוע 4 -->
            <div class="poki-card" onclick="openGame('🏃‍♂️ משחק ריצה חופשית 🏃‍♂️', 'https://gamedistribution.com')">
                <div class="emoji-icon">🛹</div>
                <h3>ריצת מכשולים</h3>
            </div>

            <!-- ריבוע 5 -->
            <div class="poki-card" onclick="openGame('🎯 קלאש יריות אונליין 🎯', 'https://gamedistribution.com')">
                <div class="emoji-icon">🔫</div>
                <h3>קרב יריות 3D</h3>
            </div>

            <!-- ריבוע 6 -->
            <div class="poki-card" onclick="openGame('⚽ כדורגל ראשים משוגע ⚽', 'https://gamedistribution.com')">
                <div class="emoji-icon">⚽</div>
                <h3>כדורגל ראשים</h3>
            </div>

        </div>
    </div>

    <!-- מסך המשחק המלא שנפתח בלחיצה (Modal) -->
    <div class="game-overlay" id="gameScreenOverlay">
        <div class="game-wrapper">
            <div class="game-header">
                <h2 id="currentGameTitle">שם המשחק</h2>
                <button class="close-btn" onclick="closeGameWindow()">❌ יציאה לתפריט</button>
            </div>
            <iframe id="pokiIframe" src="" allow="autoplay; keyboard-attach; fullscreen"></iframe>
        </div>
    </div>

    <!-- הקוד שמפעיל את הלחיצות כמו אתר אמיתי -->
    <script>
        function openGame(title, url) {
            document.getElementById('currentGameTitle').innerText = title;
            document.getElementById('pokiIframe').src = url;
            document.getElementById('gameScreenOverlay').style.display = 'flex';
            // חוסם גלילה של הרקע בזמן שמשחקים
            document.body.style.overflow = 'hidden';
        }

        function closeGameWindow() {
            document.getElementById('gameScreenOverlay').style.display = 'none';
            document.getElementById('pokiIframe').src = '';
            // מחזיר גלילה לתפריט
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
