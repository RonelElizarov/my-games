<html lang="he" dir="rtl">
<head>

    <title>POKI GREEN - PREMIUM GAMING HUB</title>
    <style>
        /* ==========================================
           CORE STYLES & GAMING THEME (NEON GREEN)
           ========================================== */
        :root {
            --primary-glow: #39ff14;
            --bg-dark: #030703;
            --card-bg: #091a09;
            --card-hover: #123312;
            --border-color: #1b4d1b;
            --text-main: #ffffff;
            --text-muted: #83b383;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* ANIMATED BACKGROUND TEXTURE */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(57,255,20,0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* ==========================================
           HEADER & NAVIGATION CORE COMPONENT
           ========================================== */
        header {
            background: linear-gradient(180deg, #091409 0%, #030703 100%);
            padding: 30px 20px;
            border-bottom: 5px solid var(--primary-glow);
            box-shadow: 0 5px 25px rgba(57, 255, 20, 0.35);
            position: relative;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
            color: var(--primary-glow);
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.8), 0 0 30px rgba(57, 255, 20, 0.4);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* ==========================================
           MAIN CONTENT GRID CONFIGURATION (POKI STYLE)
           ========================================== */
        .container {
            max-width: 1300px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .poki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 35px;
        }

        /* ==========================================
           INTERACTIVE GAME CARDS ENGINE
           ========================================== */
        .poki-link {
            text-decoration: none;
            color: inherit;
            outline: none;
        }

        .poki-card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 28px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0,0,0,0.7);
            transform: translateZ(0);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.28s ease, 
                        background-color 0.28s ease,
                        box-shadow 0.28s ease;
        }

        /* PRO GAME HOVER EFFECTS */
        .poki-card:hover {
            transform: scale(1.08) translateY(-4px) rotate(1deg);
            background-color: var(--card-hover);
            border-color: var(--primary-glow);
            box-shadow: 0 0 35px rgba(57, 255, 20, 0.7);
        }

        .emoji-icon {
            font-size: 70px;
            margin-bottom: 15px;
            transition: transform 0.28s ease;
            filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.35));
        }

        .poki-card:hover .emoji-icon {
            transform: scale(1.18);
        }

        .poki-card h3 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: var(--primary-glow);
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
            transition: color 0.28s ease;
        }

        .poki-card:hover h3 {
            color: #ffffff;
            text-shadow: 0 0 12px var(--primary-glow);
        }

        /* PREMIUM CORNER BADGE */
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--primary-glow);
            color: #000;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 10px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* ==========================================
           FOOTER SYSTEMS
           ========================================== */
        footer {
            background-color: #050d05;
            padding: 30px;
            border-top: 2px solid var(--border-color);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: bold;
            margin-top: 100px;
        }

        footer span {
            color: var(--primary-glow);
        }
    </style>
</head>
