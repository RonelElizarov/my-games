<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKI GREEN - אימפריית המשחקים שלי</title>
    <style>
        /* עיצוב האתר בסגנון פוקי גיימינג ירוק ניאון */
        body {
            background-color: #050a05; /* רקע שחור-ירוק כהה */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* סרגל עליון */
        header {
            background-color: #0f1f0f;
            padding: 25px;
            border-bottom: 5px solid #39ff14; /* קו ירוק ניאון זוהר */
            box-shadow: 0 4px 20px rgba(57, 255, 20, 0.4);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            color: #39ff14;
            text-shadow: 0 0 15px #39ff14;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .tagline {
            color: #a0cfa0;
            font-size: 15px;
            margin-top: 8px;
            font-weight: bold;
        }

        /* רשת הריבועים של פוקי */
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .poki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
        }

        /* עיצוב הקישורים שהופכים לריבועים */
        .poki-link {
            text-decoration: none;
            color: white;
        }

        .poki-card {
            background-color: #0f240f; /* ירוק כהה לריבוע */
            border: 3px solid #1c401c;
            border-radius: 24px;
            aspect-ratio: 1 / 1; /* ריבוע מושלם */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.25s ease-in-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }

        /* אפקט מעבר עכבר/לחיצה בירוק ניאון מטורף */
        .poki-card:hover {
            transform: scale(1.08) rotate(1deg);
            background-color: #143314;
            border-color: #39ff14;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
        }

        .emoji-icon {
            font-size: 65px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.3));
        }

        .poki-card h3 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #39ff14;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
        }
    </style>
</head>
<body>

    <!-- סרגל עליון ירוק ניאון -->
    <header>
        <h1>POKI GREEN</h1>
        <div class="tagline">אימפריית המשחקים הרשמית של העסק שלי! לחצו על ריבוע למשחק מיידי</div>
    </header>

    <!-- רשת הריבועים של המשחקים -->
    <div class="container">
        <div class="poki-grid">
            
            <!-- ריבוע 1 - מים ואש 1 האמיתי והנקי -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🔥💧</div>
                    <h3>מים ואש 1</h3>
                </div>
            </a>

            <!-- ריבוע 2 - גיאומטרי דאש ישיר ונקי -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🟩</div>
                    <h3>Geometry Dash</h3>
                </div>
            </a>

            <!-- ריבוע 3 - מרוצי אופנועים ישיר ונקי -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🏍️</div>
                    <h3>מרוץ אופנועים</h3>
                </div>
            </a>

            <!-- ריבוע 4 - כדורגל ראשים ישיר ונקי -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">⚽</div>
                    <h3>כדורגל ראשים</h3>
                </div>
            </a>

            <!-- ריבוע 5 - סאבוויי סרף (ריצת מכשולים) -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🛹</div>
                    <h3>סאבוויי סרף</h3>
                </div>
            </a>

            <!-- ריבוע 6 - משחק יריות תלת-ממד מטורף -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🔫</div>
                    <h3>קרב יריות 3D</h3>
                </div>
            </a>

            <!-- ריבוע 7 - מרוץ מכוניות ספורט עתידני -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🏎️</div>
                    <h3>מרוץ מכוניות</h3>
                </div>
            </a>

            <!-- ריבוע 8 - משחק טטריס קלאסי וממכר -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🧱</div>
                    <h3>טטריס קלאסי</h3>
                </div>
            </a>

            <!-- ריבוע 9 - פאקמן המקורי -->
            <a href="https://gamedistribution.com" class="poki-link">
                <div class="poki-card">
                    <div class="emoji-icon">🟡</div>
                    <h3>פאקמן</h3>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
