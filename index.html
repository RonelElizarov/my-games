<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אימפריית המשחקים המטורפת שלי</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #00ffcc;
            text-shadow: 0px 0px 15px #00ffcc;
            font-size: 35px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 30px;
        }
        /* עיצוב רשת המשחקים כמו בפוקי */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
            padding: 10px;
        }
        /* עיצוב הקוביות של המשחקים */
        .game-card {
            background: linear-gradient(135px, #222, #333);
            border: 3px solid #444;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .game-card:hover {
            transform: translateY(-5px) scale(1.03);
            border-color: #00ffcc;
            box-shadow: 0px 0px 20px rgba(0, 255, 210, 0.4);
        }
        .game-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }
        .game-card h3 {
            margin: 10px 0 0 0;
            font-size: 18px;
            color: #fff;
        }
        /* מסך המשחק שנפתח לחצי גובה מקצועי */
        .game-container {
            display: none;
            max-width: 900px;
            margin: 30px auto;
            background-color: #222;
            padding: 15px;
            border-radius: 20px;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 210, 0.3);
        }
        .game-container h2 {
            margin-top: 0;
            color: #00ffcc;
        }
        iframe {
            width: 100%;
            height: 550px;
            border: none;
            border-radius: 10px;
        }
        .close-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        .close-btn:hover {
            background-color: #ff3377;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>🎮 CrazyGames IL 🎮</h1>
    <div class="subtitle">אתר המשחקים הרשמי שלי - בחרו משחק והתחילו לשחק בחינם!</div>

    <!-- רשת הקוביות של המשחקים -->
    <div class="games-grid">
        
        <div class="game-card" onclick="playGame('🔥 מים ואש 🔥', 'https://gamedistribution.com')">
            <div class="game-icon">💎</div>
            <h3>מים ואש 1</h3>
        </div>

        <div class="game-card" onclick="playGame('📐 Geometry Dash 📐', 'https://gamedistribution.com')">
            <div class="game-icon">🟥</div>
            <h3>Geometry Dash</h3>
        </div>

        <div class="game-card" onclick="playGame('🏍️ מרוץ אופנועי שטח 🏍️', 'https://gamedistribution.com')">
            <div class="game-icon">🏍️</div>
            <h3>מרוץ אופנועים 3D</h3>
        </div>

        <div class="game-card" onclick="playGame('🏃‍♂️ סאבוויי סרף / ריצה 🏃‍♂️', 'https://gamedistribution.com')">
            <div class="game-icon">🛹</div>
            <h3>משחק ריצה חופשית</h3>
        </div>

        <div class="game-card" onclick="playGame('🎯 קרב יריות אונליין 🎯', 'https://gamedistribution.com')">
            <div class="game-icon">🔫</div>
            <h3>קלאש יריות 3D</h3>
        </div>

        <div class="game-card" onclick="playGame('⚽ כדורגל ראשים ⚽', 'https://gamedistribution.com')">
            <div class="game-icon">⚽</div>
            <h3>כדורגל ראשים משוגע</h3>
        </div>

    </div>

    <!-- המקום שבו המשחק נפתח רק כשלוחצים עליו -->
    <div class="game-container" id="gameBox">
        <h2 id="gameTitle">שם המשחק</h2>
        <iframe id="gameScreen" src="" allow="autoplay; keyboard-attach; fullscreen"></iframe>
        <br>
        <button class="close-btn" onclick="closeGame()">❌ סגור משחק</button>
    </div>

    <!-- קוד חכם שמפעיל את הלחיצות -->
    <script>
        function playGame(title, url) {
            document.getElementById('gameTitle').innerText = title;
            document.getElementById('gameScreen').src = url;
            document.getElementById('gameBox').style.display = 'block';
            // גלילה אוטומטית למסך המשחק
            document.getElementById('gameBox').scrollIntoView({ behavior: 'smooth' });
        }

        function closeGame() {
            document.getElementById('gameBox').style.display = 'none';
            document.getElementById('gameScreen').src = '';
        }
    </script>

</body>
</html>
