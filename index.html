<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKI GREEN - אימפריית המשחקים שלי</title>
    <style>
        /* עיצוב האתר בסגנון פוקי גיימינג ירוק ניאון */
        body {
            background-color: #050a05; /* רקע שחור עם נגיעה של ירוק כהה מאוד */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* סרגל עליון */
        header {
            background-color: #0f1f0f;
            padding: 25px;
            border-bottom: 5px solid #39ff14; /* קו ירוק ניאון זוהר */
            box-shadow: 0 4px 20px rgba(57, 255, 20, 0.4);
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            color: #39ff14;
            text-shadow: 0 0 15px #39ff14;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .tagline {
            color: #a0cfa0;
            font-size: 15px;
            margin-top: 8px;
            font-weight: bold;
        }

        /* רשת הריבועים של פוקי */
        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .poki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
        }

        /* עיצוב הקישורים שהופכים לריבועים */
        .poki-card {
            background-color: #0f240f; /* ירוק כהה לריבוע */
            border: 3px solid #1c401c;
            border-radius: 24px;
            aspect-ratio: 1 / 1; /* ריבוע מושלם */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease-in-out;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
        }

        /* אפקט מעבר עכבר/לחיצה בירוק ניאון מטורף */
        .poki-card:hover {
            transform: scale(1.08) rotate(1deg);
            background-color: #143314;
            border-color: #39ff14;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.8);
        }

        .emoji-icon {
            font-size: 65px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.3));
        }

        .poki-card h3 {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #39ff14;
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
        }

        /* מסך המשחק המלא שנפתח מעל הכל (Modal) */
        .game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .game-wrapper {
            width: 95%;
            max-width: 1024px;
            height: 85%;
            background-color: #050a05;
            border: 4px solid #39ff14;
            border-radius: 24px;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.6);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            background-color: #0f1f0f;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1c401c;
        }

        .game-header h2 {
            margin: 0;
            color: #39ff14;
            font-size: 22px;
        }

        .close-btn {
            background-color: #ff0055;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            background-color: #ff3377;
            transform: scale(1.05);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- סרגל עליון ירוק ניאון -->
    <header>
        <h1>POKI GREEN</h1>
        <div class="tagline">אימפריית המשחקים הרשמית של העסק שלי! לחצו על ריבוע למשחק מיידי</div>
    </header>

    <!-- רשת הריבועים של המשחקים -->
    <div class="container">
        <div class="poki-grid">
            
            <!-- ריבוע 1 - גיאומטרי דאש האמיתי -->
            <div class="poki-card" onclick="forceOpenGame('📐 Geometry Dash 📐', 'https://geometrylite.github.io/')">
                <div class="emoji-icon">🟩</div>
                <h3>Geometry Dash</h3>
            </div>

            <!-- ריבוע 2 - מים ואש 1 האמיתי -->
            <div class="poki-card" onclick="forceOpenGame('🔥 מים ואש 1 🔥', 'https://gamedistribution.com')">
                <div class="emoji-icon">🔥💧</div>
                <h3>מים ואש 1</h3>
            </div>

            <!-- ריבוע 3 - מרוצי אופנועים -->
            <div class="poki-card" onclick="forceOpenGame('🏍️ מרוץ אופנועים 3D 🏍️', 'https://gamedistribution.com')">
                <div class="emoji-icon">🏍️</div>
                <h3>מרוץ אופנועים</h3>
            </div>

            <!-- ריבוע 4 - כדורגל ראשים משוגע -->
            <div class="poki-card" onclick="forceOpenGame('⚽ כדורגל ראשים משוגע ⚽', 'https://gamedistribution.com')">
                <div class="emoji-icon">⚽</div>
                <h3>כדורגל ראשים</h3>
            </div>

        </div>
    </div>

    <!-- מסך המשחק המלא שנפתח בתוך האתר שלך (אין מעברים החוצה!) -->
    <div class="game-overlay" id="gameScreenOverlay">
        <div class="game-wrapper">
            <div class="game-header">
                <h2 id="currentGameTitle">שם המשחק</h2>
                <button class="close-btn" onclick="closeGameWindow()">❌ חזרה לתפריט</button>
            </div>
            <iframe id="pokiIframe" src="" allow="autoplay; keyboard-attach; fullscreen"></iframe>
        </div>
    </div>

    <!-- הקוד המאובטח שמנטרל את ההפניות של גיטהאב -->
    <script>
        function forceOpenGame(title, url) {
            document.getElementById('currentGameTitle').innerText = title;
            
            // הגנה מיוחדת: מונע מהאפליקציה של גיטהאב לחטוף את הלחיצה
            var iframe = document.getElementById('pokiIframe');
            iframe.removeAttribute('src');
            
            // פתיחת המשחק בצורה נקייה ומאובטחת בתוך האתר
            setTimeout(function() {
                iframe.src = url;
            }, 50);
            
            document.getElementById('gameScreenOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeGameWindow() {
            document.getElementById('gameScreenOverlay').style.display = 'none';
            document.getElementById('pokiIframe').src = '';
            document.body.style.overflow = 'auto';
        }
    </script>

</body>
</html>
