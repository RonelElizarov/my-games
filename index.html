<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אימפריית המשחקים שלי - Poki Style</title>
    <style>
        body {
            background-color: #1a052e; /* רקע סגול כהה של גיימרים */
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff007f;
            font-size: 38px;
            text-shadow: 0 0 15px #ff007f;
            margin-top: 10px;
        }
        .subtitle {
            color: #00ffff;
            font-size: 18px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        /* רשת ריבועים גדולה ונוחה כמו בפוקי */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        /* עיצוב כל קוביית משחק */
        .game-box {
            background: linear-gradient(145px, #2b0b4d, #3d1466);
            border: 4px solid #ff007f;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: all 0.2s ease-in-out;
        }
        .game-box:hover {
            transform: scale(1.06);
            border-color: #00ffff;
            box-shadow: 0 0 25px #00ffff;
        }
        .game-emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }
        .game-box h3 {
            margin: 5px 0 0 0;
            font-size: 22px;
            font-weight: bold;
        }
        /* חלון המשחק הרשמי - נפתח ענק ונוח למשחק */
        .play-section {
            display: none;
            max-width: 950px;
            margin: 40px auto;
            background-color: #0c0217;
            padding: 20px;
            border-radius: 25px;
            border: 5px solid #00ffff;
            box-shadow: 0 0 35px #00ffff;
        }
        .play-section h2 {
            color: #00ffff;
            margin-top: 0;
            font-size: 26px;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 15px;
            background-color: #000;
        }
        .close-button {
            background: linear-gradient(to right, #ff0055, #ff007f);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        .close-button:hover {
            transform: scale(1.05);
            background: #ff3377;
        }
    </style>
</head>
<body>

    <h1>🎮 CRAZY GAMES 🎮</h1>
    <div class="subtitle">האתר הרשמי של העסק שלי - משחקים חוקיים בחינם!</div>

    <!-- רשת המשחקים -->
    <div class="grid-container">
        
        <div class="game-box" onclick="startPlay('🔥 מים ואש 1 🔥', 'https://gamedistribution.com')">
            <div class="game-emoji">💧🔥</div>
            <h3>מים ואש 1</h3>
        </div>

        <div class="game-box" onclick="startPlay('🏃‍♂️ משחק ריצה ומכשולים 🏃‍♂️', 'https://gamedistribution.com')">
            <div class="game-emoji">🏃‍♂️</div>
            <h3>Geometry Dash Style</h3>
        </div>

        <div class="game-box" onclick="startPlay('🏍️ מרוץ אופנועים תלת-ממד 🏍️', 'https://gamedistribution.com')">
            <div class="game-emoji">🏍️</div>
            <h3>מרוץ אופנועים</h3>
        </div>

        <div class="game-box" onclick="startPlay('⚽ כדורגל ראשים משוגע ⚽', 'https://gamedistribution.com')">
            <div class="game-emoji">⚽</div>
            <h3>כדורגל ראשים</h3>
        </div>

    </div>

    <!-- מסך האקשן שבו משחקים -->
    <div class="play-section" id="playerArea">
        <h2 id="activeTitle">טוען משחק...</h2>
        <iframe id="gameFrame" src="" allow="autoplay; keyboard-attach; fullscreen"></iframe>
        <br>
        <button class="close-button" onclick="stopPlay()">❌ סגור משחק וחלץ לפוקי</button>
    </div>

    <script>
        function startPlay(title, url) {
            document.getElementById('activeTitle').innerText = title;
            document.getElementById('gameFrame').src = url;
            document.getElementById('playerArea').style.display = 'block';
            document.getElementById('playerArea').scrollIntoView({ behavior: 'smooth' });
        }

        function stopPlay() {
            document.getElementById('playerArea').style.display = 'none';
            document.getElementById('gameFrame').src = '';
        }
    </script>

</body>
</html>
